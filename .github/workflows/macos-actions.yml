name: Test macOS actions

on:
  pull_request:
    paths:
      - 'macos/**'
      - 'tests/**'
      - '.github/workflows/macos-actions.yml'
  push:
    branches: [main, v7]
    paths:
      - 'macos/**'
      - 'tests/**'
      - '.github/workflows/macos-actions.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: python3 -B -m unittest discover -s tests -p 'test_macos_*.py' -v
      - name: Check shell and JavaScript syntax
        run: |
          for script in macos/setup-signing/setup.sh macos/notarize/notarize.sh; do
            bash -n "$script"
          done
          node --check macos/setup-signing/index.js
          node --check macos/setup-signing/cleanup.js
